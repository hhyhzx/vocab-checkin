<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>胡诗涵英语打卡</title>
<meta name="theme-color" content="#4A6CF7">
<style>
:root {
  --bg: #f0f4f8;
  --card: #fff;
  --primary: #4A6CF7;
  --success: #10B981;
  --danger: #EF4444;
  --text: #1e293b;
  --text2: #64748b;
  --border: #e2e8f0;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
#app { max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }

/* header */
.header {
  background: var(--primary);
  color: #fff;
  padding: 16px 20px;
  padding-top: max(16px, env(safe-area-inset-top));
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
}
.header h1 { font-size:22px; font-weight:700; }
.header .sub { font-size:14px; opacity:.85; margin-top:4px; }

/* day nav */
.day-nav {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  padding:14px 20px;
  background: var(--card);
  border-bottom:1px solid var(--border);
}
.day-nav button {
  width:40px; height:40px;
  border:none; border-radius:50%;
  background: var(--bg);
  font-size:20px; color: var(--text);
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: background .15s;
}
.day-nav button:active { background: var(--border); }
.day-nav button:disabled { opacity:.3; pointer-events:none; }
.day-nav .day-info { text-align:center; }
.day-nav .day-label { font-size:18px; font-weight:700; }
.day-nav .day-date { font-size:13px; color: var(--text2); }

/* progress bar */
.progress-wrap { padding:10px 20px; background: var(--card); }
.progress-bar {
  height:8px; background: var(--border);
  border-radius:4px; overflow:hidden;
}
.progress-fill {
  height:100%; background: var(--success);
  border-radius:4px; transition: width .3s;
}
.progress-text { font-size:12px; color: var(--text2); margin-top:6px; text-align:center; }

/* word list */
.word-list { flex:1; overflow-y:auto; padding:12px 16px; -webkit-overflow-scrolling:touch; }
.word-card {
  display:flex;
  align-items:center;
  gap:12px;
  background: var(--card);
  border-radius: var(--radius);
  padding:14px 16px;
  margin-bottom:8px;
  box-shadow: var(--shadow);
  cursor:pointer;
  transition: all .15s;
  border:2px solid transparent;
  position:relative;
}
.word-card:active { transform:scale(.98); }
.word-card.learned {
  border-color: var(--success);
  background: #f0fdf4;
}
.word-card.learned .check-circle {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}
.check-circle {
  width:28px; height:28px;
  min-width:28px;
  border-radius:50%;
  border:2px solid #cbd5e1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  color: transparent;
  transition: all .2s;
}
.word-body { flex:1; min-width:0; }
.word-row {
  display:flex;
  align-items:baseline;
  gap:8px;
}
.word-en { font-size:19px; font-weight:600; color: var(--text); }
.word-pos {
  font-size:12px;
  color: var(--primary);
  background: #eef2ff;
  padding:2px 6px;
  border-radius:4px;
  white-space:nowrap;
}
.word-zh { font-size:15px; color: var(--text2); margin-top:3px; }
.word-zh-hidden { font-size:13px; color: #cbd5e1; margin-top:3px; font-style:italic; }
.word-ipa { font-size:13px; color: #94a3b8; margin-top:1px; font-style:italic; }
.word-mastery { font-size:11px; color:#f59e0b; margin-top:1px; }
.word-mastery span { color:#94a3b8; }
.word-forms { font-size:12px; color: #94a3b8; margin-top:2px; }
.word-phrases { margin-top:4px; display:flex; flex-wrap:wrap; gap:4px; }
.phrase-tag {
  font-size:11px;
  color: #6366f1;
  background: #eef2ff;
  padding:2px 7px;
  border-radius:3px;
  white-space:nowrap;
  max-width:220px;
  overflow:hidden;
  text-overflow:ellipsis;
}
.phrase-tag i {
  font-style:normal;
  color: #94a3b8;
  font-size:9px;
}
.phrase-tag em {
  font-style:normal;
  color: #a78bfa;
  font-size:9px;
  display:block;
}
.star-badge { color:#f59e0b; font-size:12px; margin-left:auto; min-width:20px; text-align:right; }
.speaker-btn {
  width:36px; height:36px;
  min-width:36px;
  border-radius:50%;
  border:none;
  background: #eef2ff;
  color: var(--primary);
  font-size:18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
}
.speaker-btn:active { background: var(--primary); color:#fff; transform:scale(.9); }
.speaker-btn.speaking { background: var(--primary); color:#fff; animation: pulse .6s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

/* batch button */
.batch-wrap { padding:8px 20px 16px; text-align:center; }
.batch-btn {
  padding:10px 32px;
  border:2px solid var(--primary);
  border-radius:24px;
  background: #fff;
  color: var(--primary);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition: all .15s;
}
.batch-btn:active { background: var(--primary); color:#fff; }

/* toast */
.toast {
  position:fixed; top:20%; left:50%; transform:translate(-50%,-50%);
  background: rgba(0,0,0,.78);
  color:#fff;
  padding:10px 24px;
  border-radius:20px;
  font-size:14px;
  z-index:999;
  pointer-events:none;
  animation: toastIn .3s ease;
}
@keyframes toastIn { from{opacity:0;transform:translate(-50%,-50%) scale(.8);} to{opacity:1;transform:translate(-50%,-50%) scale(1);} }

/* modal */
.modal-mask {
  position:fixed; inset:0;
  background: rgba(0,0,0,.35);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  animation: fadeIn .2s;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal-box {
  background:#fff;
  border-radius:16px;
  padding:24px;
  width:calc(100vw - 48px);
  max-width:360px;
  text-align:center;
}
.modal-box h2 { font-size:20px; margin-bottom:8px; }
.modal-box p { font-size:14px; color: var(--text2); margin-bottom:20px; }
.modal-box .btn-row { display:flex; gap:10px; justify-content:center; }
.modal-box button {
  padding:10px 24px;
  border-radius:20px;
  border:none;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}
.btn-primary { background: var(--primary); color:#fff; }
.btn-ghost { background: var(--bg); color: var(--text); }

/* quiz */
.quiz-box { max-width:340px; }
.quiz-opt {
  padding:12px 16px;
  border:2px solid var(--border);
  border-radius:10px;
  background:#fff;
  font-size:17px;
  cursor:pointer;
  transition: all .15s;
  text-align:center;
}
.quiz-opt:active { transform:scale(.97); }
.quiz-opt.correct { border-color: var(--success); background:#f0fdf4; }
.quiz-opt.chosen-right { border-color: var(--success); background:#dcfce7; color:#166534; font-weight:700; }
.quiz-opt.chosen-wrong { border-color: var(--danger); background:#fef2f2; color:#991b1b; }
.quiz-opt:disabled { pointer-events:none; }

/* tabs */
.tab-bar {
  display:flex;
  border-top:1px solid var(--border);
  background: var(--card);
  padding-bottom: max(4px, env(safe-area-inset-bottom));
  position:sticky;
  bottom:0;
}
.tab-item {
  flex:1;
  text-align:center;
  padding:10px 0;
  font-size:12px;
  color: var(--text2);
  cursor:pointer;
  transition: color .15s;
}
.tab-item.active { color: var(--primary); font-weight:700; }
.tab-item .tab-icon { font-size:20px; display:block; margin-bottom:2px; }

/* stats page */
.stats-wrap { padding:20px; }
.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding:20px;
  margin-bottom:12px;
  box-shadow: var(--shadow);
}
.stat-big { font-size:36px; font-weight:800; color: var(--primary); }
.stat-label { font-size:13px; color: var(--text2); }
.stat-row { display:flex; gap:12px; }
.stat-row .stat-card { flex:1; text-align:center; }
.day-grid { display:flex; flex-wrap:wrap; gap:6px; }
.day-dot {
  width:32px; height:32px;
  border-radius:8px;
  background: var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  color: var(--text2);
  cursor:pointer;
  transition: all .15s;
}
.day-dot.done { background: var(--success); color:#fff; }
.day-dot.today { border:2px solid var(--primary); }
.day-dot:active { transform:scale(.9); }

/* all-words page */
.search-bar {
  padding:12px 16px;
  background: var(--card);
  border-bottom:1px solid var(--border);
}
.search-bar input {
  width:100%;
  padding:10px 16px;
  border:1px solid var(--border);
  border-radius:24px;
  font-size:14px;
  outline:none;
  background: var(--bg);
}
.search-bar input:focus { border-color: var(--primary); }
.filter-row { display:flex; gap:8px; padding:8px 16px; }
.filter-chip {
  padding:6px 16px;
  border-radius:16px;
  border:1px solid var(--border);
  background:#fff;
  font-size:13px;
  cursor:pointer;
  transition: all .15s;
}
.filter-chip.active { background: var(--primary); color:#fff; border-color: var(--primary); }

/* celebration */
.confetti-container {
  position:fixed; inset:0; pointer-events:none; z-index:200;
}
.confetti-piece {
  position:absolute;
  width:10px; height:10px;
  border-radius:2px;
  animation: confettiFall 1.5s ease-out forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-100px) rotate(0deg); opacity:1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity:0; }
}

/* empty state */
.empty { text-align:center; padding:40px 20px; color: var(--text2); }
.empty .icon { font-size:48px; margin-bottom:12px; }

/* error notebook */
.errors-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--border); }
.errors-count { font-size:14px; color:var(--danger); font-weight:600; }
.errors-actions { display:flex; gap:8px; }
.errors-actions button {
  padding:6px 14px; border:1px solid var(--border); border-radius:16px;
  background:#fff; font-size:12px; cursor:pointer; transition:all .15s;
}
.errors-actions button:active { background:var(--bg); }
.errors-actions .btn-retry-all { border-color:var(--primary); color:var(--primary); }
.errors-actions .btn-clear-all { border-color:var(--danger); color:var(--danger); }
.error-card {
  display:flex; align-items:center; gap:12px;
  background: var(--card); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:8px;
  box-shadow: var(--shadow); cursor:pointer;
  transition:all .15s; border-left:4px solid var(--danger);
}
.error-card:active { transform:scale(.98); }
.error-card .error-badge {
  font-size:10px; color:#fff; background:var(--danger);
  padding:2px 8px; border-radius:10px; white-space:nowrap;
}
.error-card .error-count { font-size:11px; color:var(--danger); margin-top:2px; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>📚 胡诗涵英语打卡</h1>
    <div class="sub" id="headerSub">每天30词，轻松搞定中考词汇</div>
    <div class="sub" id="headerTimer" style="font-size:12px;opacity:.7;margin-top:2px;"></div>
  </div>

  <!-- day nav -->
  <div class="day-nav">
    <button id="btnPrev" title="前一天">&lsaquo;</button>
    <div class="day-info">
      <div class="day-label" id="dayLabel">第 1 / 28 天</div>
      <div class="day-date" id="dayDate"></div>
    </div>
    <button id="btnNext" title="后一天">&rsaquo;</button>
  </div>

  <!-- progress -->
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">今日进度: 0/30</div>
  </div>

  <!-- word list (tab: study) -->
  <div class="word-list" id="wordList"></div>

  <!-- batch button -->
  <div class="batch-wrap" id="batchWrap">
    <button class="batch-btn" id="btnBatchAll">✅ 今日全部打卡</button>
  </div>

  <!-- stats tab -->
  <div class="stats-wrap" id="statsWrap" style="display:none"></div>

  <!-- all words tab -->
  <div id="allWordsWrap" style="display:none;flex:1;overflow-y:auto;">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="🔍 搜索单词或释义...">
    </div>
    <div class="filter-row">
      <span class="filter-chip active" data-filter="all">全部</span>
      <span class="filter-chip" data-filter="learned">已学</span>
      <span class="filter-chip" data-filter="unlearned">未学</span>
      <span class="filter-chip" data-filter="star">⭐ 高频</span>
    </div>
    <div class="word-list" id="allWordList"></div>
  </div>

  <!-- error notebook tab -->
  <div id="errorsWrap" style="display:none;flex:1;overflow-y:auto;">
    <div class="errors-header">
      <span class="errors-count" id="errorsCount">错题: 0</span>
      <div class="errors-actions">
        <button class="btn-retry-all" id="btnRetryAll">🔄 全部重测</button>
      </div>
    </div>
    <div class="word-list" id="errorWordList"></div>
  </div>

  <!-- tab bar -->
  <nav class="tab-bar">
    <div class="tab-item active" data-tab="study">
      <span class="tab-icon">📖</span>学习
    </div>
    <div class="tab-item" data-tab="stats">
      <span class="tab-icon">📊</span>统计
    </div>
    <div class="tab-item" data-tab="all">
      <span class="tab-icon">🔍</span>全部
    </div>
    <div class="tab-item" data-tab="errors">
      <span class="tab-icon">📝</span>纠错
    </div>
  </nav>
</div>

<!-- toast container -->
<div id="toastContainer"></div>

<script>
// ── PWA: service worker registration with update detection ────────
if ('serviceWorker' in navigator) {
  function showUpdateBar(newWorker) {
    var old = document.getElementById('swUpdateToast');
    if (old) return; // already showing
    var toast = document.createElement('div');
    toast.id = 'swUpdateToast';
    toast.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:14px 20px;border-radius:24px;font-size:14px;z-index:999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4);cursor:pointer;animation:toastIn .3s ease;';
    toast.textContent = '🔄 新版本已就绪，点击更新';
    toast.addEventListener('click', function() {
      if (newWorker) {
        newWorker.postMessage({ action: 'skipWaiting' });
      }
      toast.textContent = '⏳ 正在更新...';
      setTimeout(function() { window.location.reload(); }, 800);
    });
    document.body.appendChild(toast);
    // auto-hide after 30 seconds if not clicked
    setTimeout(function() { if (toast.parentNode) toast.remove(); }, 30000);
  }

  navigator.serviceWorker.register('sw.js').then(function(reg) {
    // Case 1: SW already waiting (detected during navigation)
    if (reg.waiting) {
      showUpdateBar(reg.waiting);
      return;
    }

    // Case 2: SW update found after registration
    reg.addEventListener('updatefound', function() {
      var newWorker = reg.installing;
      if (!newWorker) return;
      newWorker.addEventListener('statechange', function() {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          showUpdateBar(newWorker);
        }
      });
    });

    // Check for updates
    reg.update();
  });

  // Reload when new SW takes over
  var refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}
</script>

var WORDS_PER_DAY = 30;
var TOTAL_DAYS = Math.ceil(VOCAB.length / WORDS_PER_DAY);

// ── state ────────────────────────────────────────────────────────
function loadState() {
  try {
    var raw = localStorage.getItem('vc_state');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { learned: {}, day: 0, mastery: {}, completedDates: {}, dayDurations: {}, errors: {}, points: 0, lastCompletedDate: '' };
}

function saveState() {
  try {
    localStorage.setItem('vc_state', JSON.stringify(state));
  } catch(e) {}
}

var state = loadState();
if (state.day >= TOTAL_DAYS) state.day = TOTAL_DAYS - 1;
if (state.day < 0) state.day = 0;

// ── helpers ──────────────────────────────────────────────────────
function getDayWords(dayIdx) {
  var start = dayIdx * WORDS_PER_DAY;
  return VOCAB.slice(start, start + WORDS_PER_DAY);
}

function countDayLearned(dayIdx) {
  var words = getDayWords(dayIdx);
  var count = 0;
  for (var i = 0; i < words.length; i++) {
    if (state.learned[words[i].id]) count++;
  }
  return count;
}

function isDayComplete(dayIdx) {
  return countDayLearned(dayIdx) >= getDayWords(dayIdx).length;
}

function totalLearned() {
  return Object.keys(state.learned).length;
}

function findWordById(id) {
  for (var i = 0; i < VOCAB.length; i++) {
    if (VOCAB[i].id === id) return VOCAB[i];
  }
  return null;
}

function showToast(msg) {
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(function(){ el.remove(); }, 1800);
}

function showConfirm(msg, onOk) {
  var html = '<div class="modal-mask" id="confirmModal">';
  html += '<div class="modal-box" style="max-width:300px;">';
  html += '<p style="font-size:15px;color:var(--text);margin:0 0 20px;">' + esc(msg) + '</p>';
  html += '<div class="btn-row">';
  html += '<button class="btn-ghost" id="confirmCancel">取消</button>';
  html += '<button class="btn-primary" id="confirmOk" style="background:var(--danger);">确定</button>';
  html += '</div></div></div>';
  var container = document.createElement('div');
  container.innerHTML = html;
  document.body.appendChild(container.firstElementChild);

  document.getElementById('confirmCancel').addEventListener('click', function() {
    document.getElementById('confirmModal').remove();
  });
  document.getElementById('confirmOk').addEventListener('click', function() {
    document.getElementById('confirmModal').remove();
    onOk();
  });
  document.getElementById('confirmModal').addEventListener('click', function(e) {
    if (e.target === this) this.remove();
  });
}

function showConfetti() {
  var container = document.createElement('div');
  container.className = 'confetti-container';
  var colors = ['#4A6CF7','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899','#06B6D4'];
  for (var i = 0; i < 60; i++) {
    var piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.top = -(Math.random() * 100) + 'px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 0.8 + 's';
    piece.style.animationDuration = (1 + Math.random() * 1.5) + 's';
    container.appendChild(piece);
  }
  document.body.appendChild(container);
  setTimeout(function(){ container.remove(); }, 2500);
}

// ── TTS (voice) ──────────────────────────────────────────────────
function speakWord(word, btn, forms, phrases, meaning) {
  if (!window.speechSynthesis) {
    showToast('你的浏览器不支持语音朗读');
    return;
  }
  window.speechSynthesis.cancel();

  window._speaking = true;
  if (btn) btn.classList.add('speaking');

  // Build a queue of utterances: word → meaning → forms → phrase1 → phrase1_zh → ...
  var queue = [];

  // 1) word (en)
  queue.push({ text: word, lang: 'en-GB', rate: 0.75 });

  // 2) word meaning (zh)
  if (meaning) {
    queue.push({ text: meaning, lang: 'zh-CN', rate: 0.85 });
  }

  // 3) forms (en)
  if (forms && forms.trim()) {
    var cleanForms = forms.replace(/\(.*?\)/g, '').replace(/[^\x00-\x7F,;\s]/g, '').trim();
    if (cleanForms) {
      queue.push({ text: cleanForms, lang: 'en-GB', rate: 0.75 });
    }
  }

  // 4) each phrase + its Chinese meaning
  if (phrases && phrases.length) {
    for (var pi = 0; pi < phrases.length; pi++) {
      queue.push({ text: phrases[pi].t, lang: 'en-GB', rate: 0.75 });
      if (phrases[pi].m) {
        queue.push({ text: phrases[pi].m, lang: 'zh-CN', rate: 0.85 });
      }
      if (phrases[pi].e) {
        queue.push({ text: phrases[pi].e, lang: 'en-GB', rate: 0.7 });
      }
    }
  }

  // floating overlay for speech text
  var overlay = document.getElementById('speechOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'speechOverlay';
    overlay.style.cssText = 'position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(30,41,59,.92);color:#fff;padding:18px 28px;border-radius:16px;font-size:22px;z-index:300;max-width:92vw;text-align:center;pointer-events:none;transition:opacity .2s;box-shadow:0 8px 24px rgba(0,0,0,.3);';
    document.body.appendChild(overlay);
  }
  overlay.style.opacity = '1';
  overlay.textContent = '';

  function speakNext(idx) {
    if (idx >= queue.length) {
      window._speaking = false;
      if (btn) btn.classList.remove('speaking');
      overlay.style.opacity = '0';
      setTimeout(function() { overlay.textContent = ''; }, 300);
      return;
    }
    var item = queue[idx];
    overlay.textContent = item.text;
    var utter = new SpeechSynthesisUtterance(item.text);
    utter.lang = item.lang;
    utter.rate = item.rate;
    utter.onend = function() { speakNext(idx + 1); };
    utter.onerror = function() { speakNext(idx + 1); };
    window.speechSynthesis.speak(utter);
  }

  speakNext(0);
}

// ── render ───────────────────────────────────────────────────────
var currentTab = 'study';

function renderDayNav() {
  document.getElementById('dayLabel').textContent = '第 ' + (state.day + 1) + ' / ' + TOTAL_DAYS + ' 天';
  document.getElementById('btnPrev').disabled = state.day <= 0;
  document.getElementById('btnNext').disabled = state.day >= TOTAL_DAYS - 1;

  var now = new Date();
  var dateStr = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
  if (state.dayDurations && state.dayDurations[state.day]) {
    dateStr += '  |  ⏱ 耗时 ' + state.dayDurations[state.day];
  }
  document.getElementById('dayDate').textContent = dateStr;
}

function renderProgress() {
  var words = getDayWords(state.day);
  var learned = countDayLearned(state.day);
  var pct = words.length > 0 ? Math.round(learned / words.length * 100) : 0;

  var timerEl = document.getElementById('headerTimer');
  if (timerEl) timerEl.textContent = '⭐ ' + (state.points || 0) + ' 积分';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = '今日进度: ' + learned + '/' + words.length;
  // celebrate if all done, record duration, award points
  if (learned === words.length && words.length > 0) {
    if (!state.dayDurations) state.dayDurations = {};
    if (!state.dayDurations[state.day]) {
      state.dayDurations[state.day] = new Date().toLocaleString('zh-CN');
      state.completedDates = state.completedDates || {};
      state.completedDates[state.day] = new Date().toLocaleString('zh-CN');

      // -- points system --
      var today = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
      var ptsMsg = '';
      if (!state.lastCompletedDate) {
        // first time ever
        state.points = (state.points || 0) + 10;
        ptsMsg = ' +10积分';
      } else if (state.lastCompletedDate === today) {
        // already completed today, no change
      } else {
        var last = new Date(state.lastCompletedDate);
        var curr = new Date(today);
        var daysSince = Math.round((curr - last) / 86400000);
        if (daysSince === 1) {
          // consecutive: award 10
          state.points = (state.points || 0) + 10;
          ptsMsg = ' +10积分（连续打卡）';
        } else if (daysSince > 1) {
          // missed days penalty: 10+20+30+... per missed day
          var missed = daysSince - 1;
          var penalty = 0;
          for (var p = 1; p <= missed; p++) { penalty += p * 10; }
          state.points = Math.max(0, (state.points || 0) - penalty);
          state.points += 10; // today's reward
          ptsMsg = ' 连续打卡中断！扣' + penalty + '分，+10今日奖励';
        }
      }
      if (daysSince !== 0) {
        state.lastCompletedDate = today;
      }
      // protect against negative
      if (state.points < 0) state.points = 0;
      saveState();

      var toastMsg = '🎉 胡诗涵，今日任务全部完成！';
      if (ptsMsg) toastMsg += '\n⭐ 当前积分：' + state.points + ' 分';
      var finalMsg = toastMsg;
      setTimeout(function() {
        showConfetti();
        showToast(finalMsg);
      }, 300);
    }
    if (!window._celebratedDay) {
      window._celebratedDay = state.day;
    }
  }
  if (learned < words.length) {
    window._celebratedDay = -1;
  }
}

function renderWordList() {
  var words = getDayWords(state.day);
  var html = '';
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    var learned = !!state.learned[w.id];
    html += '<div class="word-card' + (learned ? ' learned' : '') + '" data-id="' + w.id + '">';
    html += '<div class="check-circle">' + (learned ? '✓' : '') + '</div>';
    html += '<div class="word-body">';
    html += '<div class="word-row">';
    html += '<span class="word-en">' + esc(w.w) + '</span>';
    html += '<span class="word-pos">' + esc(w.p) + '</span>';
    if (w.star) html += '<span class="star-badge">⭐</span>';
    html += '</div>';
    if (w.ipa) html += '<div class="word-ipa">/' + esc(w.ipa) + '/</div>';
    if (state.mastery && state.mastery[w.id]) {
      html += '<div class="word-mastery">';
      for (var si = 0; si < Math.min(state.mastery[w.id], 5); si++) html += '⭐';
      html += ' <span>' + state.mastery[w.id] + '次</span></div>';
    }
    if (learned) {
      html += '<div class="word-zh">' + esc(w.m) + '</div>';
      if (w.f) html += '<div class="word-forms">' + esc(w.f) + '</div>';
      if (w.ph && w.ph.length) {
        html += '<div class="word-phrases">';
        for (var pi = 0; pi < w.ph.length; pi++) {
          html += '<span class="phrase-tag">' + esc(w.ph[pi].t) + ' <i>' + esc(w.ph[pi].m) + '</i>' + (w.ph[pi].e ? ' <em>' + esc(w.ph[pi].e) + '</em>' : '') + '</span>';
        }
        html += '</div>';
      }
    } else {
      html += '<div class="word-zh-hidden">🔒 点击答题查看释义</div>';
    }
    html += '</div>';
    html += '<button class="speaker-btn" data-word="' + esc(w.w) + '" title="朗读">🔊</button>';
    html += '</div>';
  }
  document.getElementById('wordList').innerHTML = html || '<div class="empty"><div class="icon">📭</div>暂无词汇</div>';

  var cards = document.getElementById('wordList').querySelectorAll('.word-card');
  for (var j = 0; j < cards.length; j++) {
    cards[j].addEventListener('click', function(e) {
      if (e.target.closest('.speaker-btn')) return;
      var id = this.getAttribute('data-id');
      toggleWord(id);
    });
  }
  var spks = document.getElementById('wordList').querySelectorAll('.speaker-btn');
  for (var k = 0; k < spks.length; k++) {
    spks[k].addEventListener('click', function(e) {
      e.stopPropagation();
      var id = this.closest('.word-card').getAttribute('data-id');
      var word = findWordById(id);
      speakWord(this.getAttribute('data-word'), this, word ? word.f : '', word ? word.ph : null, word ? word.m : '');
    });
  }
}

function renderStats() {
  var totalLearnedCount = totalLearned();
  var completeDays = 0;
  for (var d = 0; d < TOTAL_DAYS; d++) {
    if (isDayComplete(d)) completeDays++;
  }

  // streak
  var streak = 0;
  for (var s = state.day; s >= 0; s--) {
    if (isDayComplete(s)) streak++;
    else break;
  }

  var html = '';
  html += '<div class="stat-row">';
  html += '<div class="stat-card"><div class="stat-big">' + totalLearnedCount + '</div><div class="stat-label">已掌握词汇</div></div>';
  html += '<div class="stat-card"><div class="stat-big">' + formatPct(totalLearnedCount, VOCAB.length) + '</div><div class="stat-label">掌握率</div></div>';
  html += '</div>';

  html += '<div class="stat-row">';
  html += '<div class="stat-card"><div class="stat-big">' + completeDays + '</div><div class="stat-label">完成天数</div></div>';
  html += '<div class="stat-card"><div class="stat-big">' + (state.points || 0) + ' ⭐</div><div class="stat-label">当前积分</div></div>';
  html += '</div>';

  html += '<div class="stat-row">';
  html += '<div class="stat-card"><div class="stat-big">' + (streak || 0) + ' 🔥</div><div class="stat-label">连续打卡</div></div>';
  html += '<div class="stat-card"><div class="stat-big" style="font-size:14px;color:var(--text2);">📋 规则</div><div class="stat-label" style="font-size:12px;">每日+10分 | 断签扣分递增<br>中断1天-10 2天-30 3天-60...</div></div>';
  html += '</div>';

  // day grid
  html += '<div class="stat-card"><div style="font-weight:700;margin-bottom:12px;">📅 每日完成情况</div>';
  html += '<div class="day-grid">';
  for (var d = 0; d < TOTAL_DAYS; d++) {
    var done = isDayComplete(d);
    var today = d === state.day;
    var title = '第' + (d+1) + '天';
    if (state.dayDurations && state.dayDurations[d]) {
      title += ' - 耗时 ' + state.dayDurations[d];
    }
    html += '<div class="day-dot' + (done ? ' done' : '') + (today ? ' today' : '') + '" data-day="' + d + '" title="' + esc(title) + '">' + (d + 1) + '</div>';
  }
  html += '</div></div>';

  // reset button
  html += '<div style="text-align:center;margin-top:16px;">';
  html += '<button style="border:none;background:none;color:#94a3b8;font-size:12px;cursor:pointer;padding:8px;" id="btnReset">重置全部数据</button>';
  html += '</div>';

  document.getElementById('statsWrap').innerHTML = html;

  // day dot click → navigate to that day
  var dots = document.getElementById('statsWrap').querySelectorAll('.day-dot');
  for (var j = 0; j < dots.length; j++) {
    dots[j].addEventListener('click', function() {
      var dayIdx = parseInt(this.getAttribute('data-day'));
      state.day = dayIdx;
      saveState();
      switchTab('study');
      refreshAll();
    });
  }

  // reset
  var resetBtn = document.getElementById('btnReset');
  if (resetBtn) {
    resetBtn.addEventListener('click', function() {
      showConfirm('确定要清除所有学习记录吗？此操作不可恢复。', function() {
        state = { learned: {}, day: 0, mastery: state.mastery || {}, errors: state.errors || {} };
        saveState();
        switchTab('study');
        refreshAll();
        showToast('学习记录已重置，错题本和掌握次数保留');
      });
    });
  }
}

function renderAllWords(filter) {
  filter = filter || 'all';
  var searchText = (document.getElementById('searchInput').value || '').toLowerCase().trim();

  var filtered = VOCAB.filter(function(w) {
    if (filter === 'learned' && !state.learned[w.id]) return false;
    if (filter === 'unlearned' && state.learned[w.id]) return false;
    if (filter === 'star' && !w.star) return false;

    if (searchText) {
      var hay = (w.w + ' ' + w.m + ' ' + w.p).toLowerCase();
      if (hay.indexOf(searchText) === -1) return false;
    }
    return true;
  });

  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var w = filtered[i];
    var learned = !!state.learned[w.id];
    html += '<div class="word-card' + (learned ? ' learned' : '') + '" data-id="' + w.id + '">';
    html += '<div class="check-circle">' + (learned ? '✓' : '') + '</div>';
    html += '<div class="word-body">';
    html += '<div class="word-row">';
    html += '<span class="word-en">' + esc(w.w) + '</span>';
    html += '<span class="word-pos">' + esc(w.p) + '</span>';
    if (w.star) html += '<span class="star-badge">⭐</span>';
    if (w.u) html += '<span style="font-size:11px;color:#94a3b8;margin-left:4px;">' + esc(w.u) + '</span>';
    html += '</div>';
    if (w.ipa) html += '<div class="word-ipa">/' + esc(w.ipa) + '/</div>';
    if (state.mastery && state.mastery[w.id]) {
      html += '<div class="word-mastery">';
      for (var si = 0; si < Math.min(state.mastery[w.id], 5); si++) html += '⭐';
      html += ' <span>' + state.mastery[w.id] + '次</span></div>';
    }
    if (learned) {
      html += '<div class="word-zh">' + esc(w.m) + '</div>';
      if (w.ph && w.ph.length) {
        html += '<div class="word-phrases">';
        for (var pi = 0; pi < w.ph.length; pi++) {
          html += '<span class="phrase-tag">' + esc(w.ph[pi].t) + ' <i>' + esc(w.ph[pi].m) + '</i>' + (w.ph[pi].e ? ' <em>' + esc(w.ph[pi].e) + '</em>' : '') + '</span>';
        }
        html += '</div>';
      }
    } else {
      html += '<div class="word-zh-hidden">🔒 点击答题查看释义</div>';
    }
    html += '</div>';
    html += '<button class="speaker-btn" data-word="' + esc(w.w) + '" title="朗读">🔊</button>';
    html += '</div>';
  }
  document.getElementById('allWordList').innerHTML =
    html || '<div class="empty"><div class="icon">🔎</div>没有匹配的单词</div>';

  var cards = document.getElementById('allWordList').querySelectorAll('.word-card');
  for (var j = 0; j < cards.length; j++) {
    cards[j].addEventListener('click', function(e) {
      if (e.target.closest('.speaker-btn')) return;
      var id = this.getAttribute('data-id');
      toggleWord(id);
      var activeFilter = document.querySelector('.filter-chip.active');
      renderAllWords(activeFilter ? activeFilter.getAttribute('data-filter') : 'all');
    });
  }
  var spks = document.getElementById('allWordList').querySelectorAll('.speaker-btn');
  for (var k = 0; k < spks.length; k++) {
    spks[k].addEventListener('click', function(e) {
      e.stopPropagation();
      var id = this.closest('.word-card').getAttribute('data-id');
      var word = findWordById(id);
      speakWord(this.getAttribute('data-word'), this, word ? word.f : '', word ? word.ph : null, word ? word.m : '');
    });
  }
}

function renderErrors() {
  var errorIds = Object.keys(state.errors || {});
  var count = errorIds.length;
  document.getElementById('errorsCount').textContent = '错题: ' + count + ' 个';

  if (count === 0) {
    document.getElementById('errorWordList').innerHTML =
      '<div class="empty"><div class="icon">🎉</div><div>太棒了！没有错题</div></div>';
    return;
  }

  // Sort by error count descending (most wrong first)
  errorIds.sort(function(a, b) { return (state.errors[b] || 0) - (state.errors[a] || 0); });

  var html = '';
  for (var i = 0; i < errorIds.length; i++) {
    var id = errorIds[i];
    var w = findWordById(id);
    if (!w) continue;
    var errCount = state.errors[id] || 1;
    html += '<div class="word-card error-card" data-id="' + w.id + '">';
    html += '<div class="check-circle">✗</div>';
    html += '<div class="word-body">';
    html += '<div class="word-row">';
    html += '<span class="word-en">' + esc(w.w) + '</span>';
    html += '<span class="word-pos">' + esc(w.p) + '</span>';
    html += '<span class="error-badge">错' + errCount + '次</span>';
    if (w.star) html += '<span class="star-badge">⭐</span>';
    html += '</div>';
    if (w.ipa) html += '<div class="word-ipa">/' + esc(w.ipa) + '/</div>';
    html += '<div class="word-zh">' + esc(w.m) + '</div>';
    if (w.f) html += '<div class="word-forms">' + esc(w.f) + '</div>';
    html += '</div>';
    html += '<button class="speaker-btn" data-word="' + esc(w.w) + '" title="朗读">🔊</button>';
    html += '</div>';
  }
  document.getElementById('errorWordList').innerHTML = html;

  var cards = document.getElementById('errorWordList').querySelectorAll('.word-card');
  for (var j = 0; j < cards.length; j++) {
    cards[j].addEventListener('click', function(e) {
      if (e.target.closest('.speaker-btn')) return;
      var id = this.getAttribute('data-id');
      showQuiz(id);
    });
  }
  var spks = document.getElementById('errorWordList').querySelectorAll('.speaker-btn');
  for (var k = 0; k < spks.length; k++) {
    spks[k].addEventListener('click', function(e) {
      e.stopPropagation();
      var id = this.closest('.word-card').getAttribute('data-id');
      var word = findWordById(id);
      speakWord(this.getAttribute('data-word'), this, word ? word.f : '', word ? word.ph : null, word ? word.m : '');
    });
  }
}

function renderBatchButton() {
  var words = getDayWords(state.day);
  var learned = countDayLearned(state.day);
  var allDone = learned >= words.length;
  var btn = document.getElementById('btnBatchAll');
  if (allDone) {
    btn.textContent = '🔄 取消全部打卡';
    btn.style.borderColor = 'var(--danger)';
    btn.style.color = 'var(--danger)';
  } else {
    btn.textContent = '✅ 今日全部打卡 (' + (words.length - learned) + ' 个未完成)';
    btn.style.borderColor = 'var(--primary)';
    btn.style.color = 'var(--primary)';
  }
}

function refreshAll() {
  renderDayNav();
  renderProgress();
  renderWordList();
  renderBatchButton();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-item').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-tab') === tab);
  });

  var showStudy = tab === 'study';
  var showStats = tab === 'stats';
  var showAll = tab === 'all';
  var showErrors = tab === 'errors';

  document.getElementById('wordList').style.display = showStudy ? '' : 'none';
  document.getElementById('batchWrap').style.display = showStudy ? '' : 'none';
  document.querySelector('.day-nav').style.display = showStudy ? '' : 'none';
  document.querySelector('.progress-wrap').style.display = showStudy ? '' : 'none';

  document.getElementById('statsWrap').style.display = showStats ? '' : 'none';
  document.getElementById('allWordsWrap').style.display = showAll ? '' : 'none';
  document.getElementById('errorsWrap').style.display = showErrors ? '' : 'none';

  if (showAll) {
    var activeFilter = document.querySelector('.filter-chip.active');
    renderAllWords(activeFilter ? activeFilter.getAttribute('data-filter') : 'all');
  }
  if (showStats) renderStats();
  if (showErrors) renderErrors();
  if (showStudy) refreshAll();
}

// ── actions ──────────────────────────────────────────────────────
function toggleWord(id) {
  if (window._speaking) {
    showToast('请等语音读完再选择');
    return;
  }
  // if already learned, unlearn directly
  if (state.learned[id]) {
    delete state.learned[id];
    saveState();
    refreshAll();
    return;
  }
  // not learned yet → show quiz
  showQuiz(id);
}

function showQuiz(id) {
  var word = findWordById(id);
  if (!word) return;

  // pick 3 wrong options from other words
  var others = [];
  for (var i = 0; i < VOCAB.length; i++) {
    if (VOCAB[i].id !== id && VOCAB[i].m) others.push(VOCAB[i].m);
  }
  // shuffle and pick 3
  for (var j = others.length - 1; j > 0; j--) {
    var k = Math.floor(Math.random() * (j + 1));
    var tmp = others[j]; others[j] = others[k]; others[k] = tmp;
  }
  var options = [word.m, others[0], others[1], others[2]];
  // shuffle options
  for (var j = options.length - 1; j > 0; j--) {
    var k = Math.floor(Math.random() * (j + 1));
    var tmp = options[j]; options[j] = options[k]; options[k] = tmp;
  }

  var html = '<div class="modal-mask" id="quizModal">';
  html += '<div class="modal-box quiz-box">';
  html += '<div style="font-size:12px;color:var(--text2);margin-bottom:4px;">选出正确的中文意思</div>';
  html += '<div style="font-size:28px;font-weight:700;color:var(--primary);margin:12px 0;">' + esc(word.w) + '</div>';
  if (word.ipa) html += '<div style="font-size:14px;color:#94a3b8;margin-bottom:8px;">/' + esc(word.ipa) + '/</div>';
  html += '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">';
  for (var o = 0; o < options.length; o++) {
    html += '<button class="quiz-opt" data-ans="' + esc(options[o]) + '">' + esc(options[o]) + '</button>';
  }
  html += '</div>';
  html += '<div id="quizFeedback" style="margin-top:10px;font-size:13px;min-height:20px;"></div>';
  html += '</div></div>';

  var container = document.createElement('div');
  container.innerHTML = html;
  document.body.appendChild(container.firstElementChild);

  var correct = word.m;

  document.querySelectorAll('.quiz-opt').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var chosen = this.getAttribute('data-ans');
      var feedback = document.getElementById('quizFeedback');
      // disable all buttons
      document.querySelectorAll('.quiz-opt').forEach(function(b) {
        b.disabled = true;
        if (b.getAttribute('data-ans') === correct) b.classList.add('correct');
      });

      if (chosen === correct) {
        this.classList.add('chosen-right');
        // mastery counter (only goes up, never down)
        if (!state.mastery) state.mastery = {};
        state.mastery[id] = (state.mastery[id] || 0) + 1;
        var stars = '';
        for (var s = 0; s < Math.min(state.mastery[id], 5); s++) stars += '⭐';
        feedback.innerHTML = '<span style="color:#10B981;">胡诗涵，你真棒！ ' + stars + ' (' + state.mastery[id] + '次)</span>';
        state.learned[id] = true;
        // remove from errors if corrected
        if (state.errors && state.errors[id]) { delete state.errors[id]; }
        saveState();
        // speak after short delay
        var w = word;
        setTimeout(function() { speakWord(w.w, null, w.f, w.ph, w.m); }, 400);
        setTimeout(function() {
          var modal = document.getElementById('quizModal');
          if (modal) modal.remove();
          refreshAll();
          if (currentTab === 'errors') renderErrors();
        }, 1200);
      } else {
        this.classList.add('chosen-wrong');
        // add to error notebook
        if (!state.errors) state.errors = {};
        state.errors[id] = (state.errors[id] || 0) + 1;
        saveState();
        feedback.innerHTML = '<span style="color:#EF4444;">已加入错题本 (错误' + state.errors[id] + '次) | 正确答案：' + esc(correct) + '</span>';
        // speak the correct word
        var w = word;
        setTimeout(function() { speakWord(w.w, null, null, null, w.m); }, 300);
        setTimeout(function() {
          var modal = document.getElementById('quizModal');
          if (modal) modal.remove();
          if (currentTab === 'errors') renderErrors();
        }, 2000);
      }
    });
  });

  // click mask to close
  document.getElementById('quizModal').addEventListener('click', function(e) {
    if (e.target === this) this.remove();
  });
}

function batchToggleDay() {
  var words = getDayWords(state.day);
  var learned = countDayLearned(state.day);
  var allDone = learned >= words.length;

  if (allDone) {
    // uncheck all
    for (var i = 0; i < words.length; i++) {
      delete state.learned[words[i].id];
    }
  } else {
    // check all
    for (var i = 0; i < words.length; i++) {
      state.learned[words[i].id] = true;
    }
    showConfetti();
    showToast('🎉 今日任务全部完成！');
  }
  saveState();
  refreshAll();
}

// ── utils ────────────────────────────────────────────────────────
function esc(s) {
  s = String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatPct(part, total) {
  if (total === 0) return '0%';
  return Math.round(part / total * 100) + '%';
}

// ── event bindings ───────────────────────────────────────────────
document.getElementById('btnPrev').addEventListener('click', function() {
  if (state.day > 0) { state.day--; saveState(); refreshAll(); }
});
document.getElementById('btnNext').addEventListener('click', function() {
  if (state.day < TOTAL_DAYS - 1) { state.day++; saveState(); refreshAll(); }
});
document.getElementById('btnBatchAll').addEventListener('click', batchToggleDay);

document.querySelectorAll('.tab-item').forEach(function(el) {
  el.addEventListener('click', function() {
    switchTab(this.getAttribute('data-tab'));
  });
});

document.querySelectorAll('.filter-chip').forEach(function(el) {
  el.addEventListener('click', function() {
    document.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
    this.classList.add('active');
    renderAllWords(this.getAttribute('data-filter'));
  });
});

document.getElementById('searchInput').addEventListener('input', function() {
  var activeFilter = document.querySelector('.filter-chip.active');
  renderAllWords(activeFilter ? activeFilter.getAttribute('data-filter') : 'all');
});

// ── error notebook buttons ────────────────────────────────────────
document.getElementById('btnRetryAll').addEventListener('click', function() {
  var errorIds = Object.keys(state.errors || {});
  if (errorIds.length === 0) { showToast('没有错题需要重测'); return; }
  // pick the first error word and quiz it
  var firstId = errorIds[0];
  showQuiz(firstId);
});
// ── swipe support ────────────────────────────────────────────────
var touchStartX = 0;
var touchStartY = 0;
document.getElementById('wordList').addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
document.getElementById('wordList').addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    if (dx < 0 && state.day < TOTAL_DAYS - 1) {
      state.day++; saveState(); refreshAll();
    } else if (dx > 0 && state.day > 0) {
      state.day--; saveState(); refreshAll();
    }
  }
});

// ── init ─────────────────────────────────────────────────────────
refreshAll();
setInterval(function() {
  if (currentTab === 'study') renderProgress();
}, 10000);  // update timer every 10s
</script>
</body>
</html>
